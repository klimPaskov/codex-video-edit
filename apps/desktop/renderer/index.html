<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>codex-video-edit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true"></span><span>codex-video-edit</span>
      <nav aria-label="Application">
        <button id="back" hidden>Library</button
        ><button id="settings">Settings</button>
      </nav>
    </header>
    <main>
      <section id="home" aria-label="Media library">
        <div class="actions">
          <button id="import" class="primary">Import video</button>
        </div>
        <ul id="library" aria-label="Imported videos"></ul>
      </section>
      <section id="viewer" aria-label="Imported video" hidden>
        <div class="source-bar">
          <span class="stage">Record or Import</span
          ><strong id="source-name"></strong
          ><button
            id="source-details"
            aria-expanded="false"
            aria-controls="inspector"
          >
            Source details
          </button>
        </div>
        <div class="workspace">
          <div class="preview">
            <canvas id="frame" aria-label="Source frame"></canvas>
            <p id="preview-message" hidden></p>
          </div>
          <aside id="inspector" aria-label="Source details" hidden>
            <div class="panel-header">
              <h2>Source</h2>
              <button id="close-inspector" aria-label="Close source details">
                ×
              </button>
            </div>
            <dl id="source-properties"></dl>
          </aside>
        </div>
        <div id="frame-controls">
          <label for="seek">Frame preview</label
          ><output id="time" for="seek"></output>
          <input
            id="seek"
            type="range"
            min="0"
            max="0"
            value="0"
            aria-label="Source position"
          />
          <div class="transport">
            <button id="previous" aria-label="Previous frame">←</button
            ><button id="next" aria-label="Next frame">→</button>
          </div>
        </div>
      </section>
      <div id="progress" role="status" hidden>
        <span>Importing video…</span><button id="cancel">Cancel</button>
      </div>
      <p id="error" role="alert" hidden></p>
    </main>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form">
        <div class="panel-header">
          <h2 id="settings-title">Settings</h2>
          <button type="button" id="close-settings" aria-label="Close settings">
            ×
          </button>
        </div>
        <label for="interface-scale">Interface size</label
        ><select id="interface-scale">
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
        <p id="settings-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="cancel-settings">Cancel</button
          ><button type="submit" class="primary" id="save-settings">
            Save
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script src="renderer.js"></script>
  </body>
</html>
